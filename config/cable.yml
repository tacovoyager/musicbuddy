# Solid Cable persists broadcasts to the database, so they cross the process boundary
# between the forked Solid Queue worker and the Puma web process that holds the websocket.
development:
  adapter: solid_cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
